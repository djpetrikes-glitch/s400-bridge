name: build-debug-apk
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
      # Keep the same debug signing key between builds, so each APK installs over the previous one.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: s400-debug-keystore-v1
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: s400-bridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
